<!DOCTYPE html>
<html lang="{{ language }}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}PolySentinel{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script id="ui-translations" type="application/json">{{ translations | tojson }}</script>
<script src="{{ url_for('static', filename='localization.js') }}"></script>
<script>
    function getSourceConfig(rawSource) {
        if (!rawSource) return { label: 'UNK', class: 'badge-unk' };
        const s = rawSource.toString().toLowerCase();
        if (s.includes('tornado') || s.includes('private')) return { label: 'ANON', class: 'badge-anon' };
        if (s.includes('coinbase') || s.includes('binance') || s.includes('kraken')) return { label: 'CEX', class: 'badge-cex' };
        return { label: 'UNK', class: 'badge-unk' };
    }
</script>
{% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">PolySentinel</span></a>

            <nav class="nav">
                <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="/insider" class="nav-item {% if request.path == '/insider' %}active{% endif %}">Insiders</a>
                <a href="/transfers" class="nav-item {% if request.path in ['/transfers', '/funding'] %}active{% endif %}">Transfers</a>
                <a href="/documentation" class="nav-item {% if request.path == '/documentation' %}active{% endif %}">Methodology</a>
                <a href="/about" class="nav-item {% if request.path == '/about' %}active{% endif %}">About</a>
                <a href="/dev" class="nav-item {% if request.path == '/dev' %}active{% endif %}">Developer</a>
                <a href="/disclaimer" class="nav-item {% if request.path == '/disclaimer' %}active{% endif %}">Disclaimer</a>
            </nav>

            <div class="language-toggle" role="group" aria-label="Language">
                <a href="{{ request.path }}?{{ dict(request.args, lang='pt-BR') | urlencode }}" lang="pt-BR" data-language-link="true" {% if language == 'pt-BR' %}aria-current="true"{% endif %}>PT-BR</a>
                <a href="{{ request.path }}?{{ dict(request.args, lang='en') | urlencode }}" lang="en" data-language-link="true" {% if language == 'en' %}aria-current="true"{% endif %}>English</a>
            </div>
            <div class="topbar-meta" title="API response time">v1.0 · <span id="sys-latency">local</span></div>
        </div>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
